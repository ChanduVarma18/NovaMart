<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobiles - NovaMart</title>
    <link rel="stylesheet" href="../css/mobiles.css">
    <script src="../js/script.js" defer></script> <!-- Link script.js here -->
</head>
<body>
    <nav>
        <div class="logo">NovaMart</div>
        <ul>
            <li><a href="../home.html">Home</a></li>
            <li><a href="../cart.html">Cart</a></li>
            <li><a href="../index.html">Logout</a></li>
        </ul>
    </nav>

    <div class="hero">
        <h1>Latest Smartphones</h1>
        <p>Find the best mobile phones at unbeatable prices!</p>
    </div>

    <section class="mobiles">
        <div class="product">
            <img src="../assets/mobile1.avif" alt="Samsung Galaxy S24 Ultra">
            <div class="product-info">
                <h3>Samsung Galaxy S24 Ultra</h3>
                <p>8GB RAM, 128GB Storage</p>
            </div>
            <button class="add-to-cart" data-name="Samsung Galaxy S24 Ultra" data-price="99999" data-image="../assets/mobile1.avif">Add to Cart</button>
        </div>

        <div class="product">
            <img src="../assets/mobile2.avif" alt="iPhone 16 Pro Max">
            <div class="product-info">
                <h3>iPhone 16 Pro Max</h3>
                <p>256GB Storage, A16 Bionic</p>
            </div>
            <button class="add-to-cart" data-name="iPhone 16 Pro Max" data-price="119999" data-image="../assets/mobile2.avif">Add to Cart</button>
        </div>

        <div class="product">
            <img src="../assets/mobile3.avif" alt="OnePlus 11">
            <div class="product-info">
                <h3>OnePlus 11</h3>
                <p>12GB RAM, 256GB Storage</p>
            </div>
            <button class="add-to-cart" data-name="OnePlus 11" data-price="59999" data-image="../assets/mobile3.avif">Add to Cart</button>
        </div>

        <div class="product">
            <img src="../assets/mobile4.avif" alt="Google Pixel 7">
            <div class="product-info">
                <h3>Google Pixel 7</h3>
                <p>128GB Storage, Tensor G2</p>
            </div>
            <button class="add-to-cart" data-name="Google Pixel 7" data-price="64999" data-image="../assets/mobile4.avif">Add to Cart</button>
        </div>
    </section>
</body>
</html>
