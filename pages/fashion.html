<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>NovaMart - Fashion</title>
    <link rel="stylesheet" href="../css/fashion.css" />
</head>
<body>
    <!-- Navbar -->
    <nav>
        <div class="logo">NovaMart</div>
        <ul>
            <li><a href="../home.html">Home</a></li>
            <li><a href="../cart.html">Cart</a></li>
            
            <li><a href="index.html">Logout</a></li>
        </ul>
    </nav>

    <!-- Fashion Hero Section -->
    <div class="hero">
        <h1>Explore the Latest Fashion Trends</h1>
        <p>Stay stylish with our premium collections.</p>
        <a class="shop-now" href="#">Shop Now</a>
    </div>

    <!-- Fashion Products -->
    <div class="fashion">
        <div class="product">
            <img src="../assets/shirt.avif" alt="Shirt" />
            <div class="details">
                <h3>Monogram Flower Perforated Leather Polo Shirt</h3>
                <p>₹ 789,000</p>
                <button>Add to Cart</button>
            </div>
        </div>

        <div class="product">
            <img src="../assets/girl.avif" alt="Gown" />
            <div class="details">
                <h3>Rhinestone Bib Tiered Gown</h3>
                <p>₹ 1,178,000</p>
                <button>Add to Cart</button>
            </div>
        </div>

        <div class="product">
            <img src="../assets/jeans.avif" alt="jeans" />
            <div class="details">
                <h3> Monogram jeans</h3>
                <p>₹ 467,000</p>
                <button>Add to Cart</button>
            </div>
        </div>

        <div class="product">
            <img src="../assets/saree.avif" alt="saree" />
            <div class="details">
                <h3>Pattu saree</h3>
                <p>₹ 4,000,000</p>
                <button>Add to Cart</button>
            </div>
        </div>
    </div>
</body>
</html>
