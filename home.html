<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaMart - Home</title>
    <link rel="stylesheet" href="css/home.css">
</head>
<body>

    <!-- Navbar -->
    <nav>
        <div class="logo">NovaMart</div>
        <ul>
            <li><a href="home.html">Home</a></li>
            <li><a href="index.html">Logout</a></li>
            <li><a href="../cart.html">Cart</a></li>
           
        </ul>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Welcome to NovaMart</h1>
        <p>Your one-stop shop for fashion, gadgets, and more!</p>
        <a href="#categories" class="shop-now">Shop Now</a>
    </section>

    <!-- Categories Section -->
    <section id="categories" class="categories">
        <div class="category" data-page="fashion.html">
            <img src="assets/fashion.avif" alt="Fashion">
            <h3>Men's & Women's Fashion</h3>
        </div>
        <div class="category" data-page="mobiles.html">
            <img src="assets/mobiles.avif" alt="Mobiles">
            <h3>Mobiles</h3>
        </div>
        <div class="category" data-page="toys.html">
            <img src="assets/toys.avif" alt="Toys">
            <h3>Kids' Toys</h3>
        </div>
        <div class="category" data-page="laptops.html">
            <img src="assets/laptops.avif" alt="Laptops">
            <h3>Trending Laptops</h3>
        </div>
        <div class="category" data-page="home-appliances.html">
            <img src="assets/home-appliances.avif" alt="Home Appliances">
            <h3>Home Appliances</h3>
        </div>
        <div class="category" data-page="pooja-items.html">
            <img src="assets/pooja-items.avif" alt="Pooja Items">
            <h3>Pooja-Items</h3>
        </div>
        <div class="category" data-page="furniture.html">
            <img src="assets/furniture.avif" alt="Furniture">
            <h3>Furniture</h3>
        </div>
        <div class="category" data-page="accessories.html">
            <img src="assets/accessories.avif" alt="Accessories">
            <h3>Accessories</h3>
        </div>        
    </section> 

    <script src="js/home.js"></script>
</body>
</html>
